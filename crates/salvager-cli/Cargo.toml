[package]
name = "salvager-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Helix Salvager CLI — Recover files from corrupt archives"
readme = "../../README.md"
keywords = ["archive", "recovery", "corrupt", "zip", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "salvager"
path = "src/main.rs"

[dependencies]
salvager-core = { path = "../salvager-core" }
clap = { version = "4", features = ["derive", "color"] }
serde_json = "1"
indicatif = "0.17"
colored = "2"
