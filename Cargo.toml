[workspace]
members = [
    "crates/salvager-core",
    "crates/salvager-server",
    "crates/salvager-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Ved Prakash Pandey <linuxlover94@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vedLinuxian/helix-salvager"
homepage = "https://vedlinuxian.github.io/helix-salvager/"
readme = "README.md"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
